# Multilingual fallback text and dictionary for Contract Autopsy Agent (Stage 3)
# Supported languages: English, Hindi, Telugu, Tamil

ai_unavailable:
  English: "AI is unavailable. Showing the local fallback."
  Hindi: "AI उपलब्ध नहीं है। स्थानीय वैकल्पिक परिणाम दिखाया जा रहा है।"
  Telugu: "AI అందుబాటులో లేదు. స్థానిక ప్రత్యామ్నాయ ఫలితం చూపబడుతోంది."
  Tamil: "AI கிடைக்கவில்லை. உள்ளூர் மாற்று முடிவு காட்டப்படுகிறது."

contract_text_missing:
  English: "No readable contract text was available to generate a summary."
  Hindi: "सारांश तैयार करने के लिए कोई पठनीय अनुबंध पाठ उपलब्ध नहीं था।"
  Telugu: "సారాంశాన్ని రూపొందించడానికి చదవగలిగే ఒప్పంద పాఠ్యం ఏదీ అందుబాటులో లేదు."
  Tamil: "சுருக்கத்தை உருவாக்க படிக்கக்கூடிய ஒப்பந்த உரை எதுவும் கிடைக்கவில்லை."

preview_clause:
  English: "Source-text preview only. Verify the original contract before relying on this text."
  Hindi: "केवल स्रोत-पाठ पूर्वावलोकन। इस पाठ पर भरोसा करने से पहले मूल अनुबंध की पुष्टि करें।"
  Telugu: "మూల పాఠ్య ప్రివ్యూ మాత్రమే. ఈ పాఠ్యంపై ఆధారపడే ముందు అసలు ఒప్పందాన్ని ధృవీకరించండి."
  Tamil: "மூல உரை முன்னோட்டம் மட்டுமே. இந்த உரையை நம்புவதற்கு முன் அசல் ஒப்பந்தத்தை சரிபார்க்கவும்."

disclaimers:
  English: "This summary is informational and is not legal advice. Check all points against the original contract."
  Hindi: "यह सारांश केवल जानकारी के लिए है, कानूनी सलाह नहीं। सभी बिंदुओं को मूल अनुबंध से जाँचें।"
  Telugu: "ఈ సారాంశం సమాచారం కోసం మాత్రమే; ఇది న్యాయ సలహా కాదు. అన్ని అంశాలను అసలు ఒప్పందంతో తనిఖీ చేయండి."
  Tamil: "இந்தச் சுருக்கம் தகவலுக்காக மட்டுமே; இது சட்ட ஆலோசனை அல்ல. அனைத்து அம்சங்களையும் அசல் ஒப்பந்தத்துடன் சரிபார்க்கவும்."

